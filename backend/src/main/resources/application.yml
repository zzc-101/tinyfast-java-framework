server:
  port: 8080

spring:
  application:
    name: base
  profiles:
    active: dev

  # 虚拟线程：Tomcat 请求线程和 @Async 等使用虚拟线程（JDK 21+）
  threads:
    virtual:
      enabled: true

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# 日志配置
logging:
  file:
    path: ./logs
  logback:
    rollingpolicy:
      max-history: 30

# 自定义配置
base:
  security:
    jwt:
      # access_token 过期时间（分钟）
      access-token-expire: 120
      # refresh_token 过期时间（天）
      refresh-token-expire: 7
    # 登录图形验证码
    captcha:
      enabled: true
    # 登录失败锁定：同一用户名连续密码错误达到次数后锁定
    login:
      max-fail-count: 5
      lock-minutes: 15
    # 鉴权用户信息（角色、权限）的 Redis 缓存时间（分钟）
    user-cache-minutes: 30
    # 不需要认证的路径
    ignore-urls:
      - /api/auth/login
      - /api/auth/captcha
      - /api/auth/refresh
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json
